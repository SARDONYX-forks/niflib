name: Build niflib

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [release] # release | debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC Environment(Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1.10.0

      - name: Install dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Cmake pre
        run: cmake --preset ${{ matrix.build_type }}
      - name: Cmake build
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: CMake install into build/
        run: cmake --install build --prefix build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niflib-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/**/*
